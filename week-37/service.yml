apiVersion: v1
kind: Service
metadata:
  name: my-service
spec:
  selector:
    app: backend-server # here, the labels name will come
  ports:
  - protocol: TCP
    port: 80 # port 80 of the loadbalancer forwards the request to the port 3000 of the pod
    targetPort: 3000
    nodePort: 30007
  type: NodePort 
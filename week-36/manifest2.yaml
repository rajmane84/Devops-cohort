version: apps/v1
kind: Deployment
medadata:
  name: frontend-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: apache
    template:
      metadata:
        labels:
          app: apache
      spec:
        containers:
          - name: httpd:2.4 
            ports:
            - containerPort: 80
---
version: v1
kind: Service
medadata:
  name: frontend-service
spec:
  selector:
    app: apache
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
  type: ClusterIP
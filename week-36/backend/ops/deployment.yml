apiVersion: apps/v1
kind: Deployment
metadata:
  name: golang-basic-http-server-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: golang-http-backend
  template:
    metadata:
      labels:
        app: golang-http-backend
    spec:
      containers:
      - name: golang-backend
        image: rajmane84/week_36_devops_configmaps_secrets:2.0.1
        ports:
        - containerPort: 5000 
      #   volumeMounts:
      #   - name: env-file
      #     readOnly: true
      #     mountPath: "/app/secret"
      # volumes:
      # - name: env-file
      #   secret:
      #     secretName: golang-http-server-secret
        env:
        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: golang-http-server-config
              key: PORT
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: golang-http-server-secret
              key: DATABASE_URL